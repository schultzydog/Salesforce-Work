<template>
    <template if:true={isSelfServiceAdministrator}>
        <div class="slds-m-vertical_medium">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                </div>
                <div class="slds-media__body">
                    <div class="slds-card__header-title slds-text-heading_medium ">
                        Subscribers
                    </div>
                </div>
                <div class="slds-no-flex">
                    <div class="header-actions">
                        <div class="slds-show_inline-block">
                            <lightning-input type="search" value={searchTerm} variant="label-hidden" label="hidden"
                                onchange={search}></lightning-input>
                        </div>
                        <lightning-button label="Add Subscriber" variant="brand" title="" onclick={editContact}
                            class="slds-m-left_x-small"></lightning-button>
                    </div>
                </div>
            </header>
        </div>

        <div class="paging-controls slds-m-bottom_x-small slds-text-align_right slds-text-body_small">
            <template if:true={previousDisabled}>
                <span class="disabled"><i class="fal fa-angle-left"></i>&nbsp;Previous</a></span>
            </template>
            <template if:false={previousDisabled}>
                <a onclick={previous} disabled={previousDisabled}><i class="fal fa-angle-left"></i>&nbsp;Previous</a>
            </template>

            &nbsp;&nbsp;&nbsp;

            <template if:true={nextDisabled}>
                <span class="disabled">Next&nbsp;<i class="fal fa-angle-right"></i></span>
            </template>
            <template if:false={nextDisabled}>
                <a onclick={next} disabled={nextDisabled}>Next&nbsp;<i class="fal fa-angle-right"></i></a>
            </template>
        </div>


        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout" aria-label="">
            <thead>
                <tr class="slds-line-height_reset">
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Name">Name</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Title">Title</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Email">Email</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Country">Country</div>
                    </th>
                    <th class="width_small" scope="col">
                        <div class="slds-truncate" title="Status" style="padding-left: 18px;">Status</div>
                    </th>
                    <th class="width_small" scope="col">
                        <div class="slds-text-align_center" title="Subscriptions">Subscriptions</div>
                    </th>
                    <th class="width_small" scope="col">
                        <div class="slds-text-align_center" title="Amount">Actions</div>
                    </th>
                </tr>
            </thead>
            <tbody>
                <template for:each={subscribers} for:item="subscriber" for:index="i">

                    <tr key={subscriber.Id} class="slds-hint-parent">
                        <th data-label="" scope="row">
                            <div class="slds-truncate" title="">
                                <a onclick={editContact} data-contact-id={subscriber.Id}
                                    data-contact-key={subscriber.Crypto_Key__c} tabindex="-1">{subscriber.Name}</a>
                            </div>
                        </th>
                        <td data-label="">
                            <div class="slds-truncate" title="">{subscriber.Title}</div>
                        </td>
                        <td data-label="">
                            <div class="slds-truncate" title="">{subscriber.Email}</div>
                        </td>
                        <td data-label="">
                            <div class="slds-truncate" title="">{subscriber.MailingCountry}</div>
                        </td>
                        <td data-label="">
                            <div class="slds-truncate" title="">
                                <template if:true={subscriber.isEnabled}>
                                    <i class="fal fa-check-circle success"></i>
                                </template>
                                <template if:false={subscriber.isEnabled}>
                                    <i class="fal fa-times-circle disabled"></i>
                                </template>
                                &nbsp;{subscriber.Status__c}
                            </div>
                        </td>
                        <td data-label="">
                            <div class="slds-text-align_center" title="">
                                <template if:true={subscriber.isEnabled}>
                                    <a onclick={showContactPreferences} data-contact-id={subscriber.Id}
                                        data-contact-key={subscriber.Crypto_Key__c} data-contact-name={subscriber.Name}>
                                        {subscriber.Active_Contact_Preferences__c}
                                    </a>
                                </template>
                                <template if:false={subscriber.isEnabled}>
                                    <i class="fal fa-minus disabled"></i>
                                </template>
                            </div>
                        </td>
                        <td data-label="">
                            <div class="slds-text-align_center actions" title="">
                                <lightning-button-menu alternative-text="Show menu" menu-alignment="auto"
                                    icon-size="x-small" data-contact-id={subscriber.Id}
                                    data-contact-key={subscriber.Crypto_Key__c} data-contact-name={subscriber.Name} 
                                    data-contact-status={subscriber.Status__c} data-i={i}
                                    onselect={handleSubscriberAction}>
                                    <lightning-menu-item value="editContact" label="Edit Contact Details" prefix-icon-name="utility:edit">
                                    </lightning-menu-item>
                                    <lightning-menu-item value="manageSubscription" label="Manage Subscriptions" prefix-icon-name="utility:settings">
                                    </lightning-menu-item>
                                    <lightning-menu-item value="toggleStatus" label={subscriber.toggleStatusLabel} prefix-icon-name={subscriber.toggleStatusIconName}>
                                    </lightning-menu-item>
                                </lightning-button-menu>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>

        <template if:false={hasSubscribers}>
            <div class="slds-text-align_center slds-text-color_weak slds-m-top_medium">
                No Subscribers to Display
            </div>
        </template>

        <div class="paging-controls slds-m-top_small slds-text-align_right slds-text-body_small">
            <template if:true={previousDisabled}>
                <span class="disabled"><i class="fal fa-angle-left"></i>&nbsp;Previous</a></span>
            </template>
            <template if:false={previousDisabled}>
                <a onclick={previous} disabled={previousDisabled}><i class="fal fa-angle-left"></i>&nbsp;Previous</a>
            </template>

            &nbsp;&nbsp;&nbsp;

            <template if:true={nextDisabled}>
                <span class="disabled">Next&nbsp;<i class="fal fa-angle-right"></i></span>
            </template>
            <template if:false={nextDisabled}>
                <a onclick={next} disabled={nextDisabled}>Next&nbsp;<i class="fal fa-angle-right"></i></a>
            </template>
        </div>

        <template if:true={selectedSubscriber}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small"
                aria-labelledby="modal-heading-01" aria-modal="true">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">{contactModalHeader}</h1>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium subscriber-modal_min-height"
                        id="modal-content-id-1">
                        <div if:true={isWorking}>
                            <div class="slds-spinner_container slds-is-fixed">
                                <div role="status" class="slds-spinner slds-spinner_medium">
                                <span class="slds-assistive-text">Loading</span>
                                <div class="slds-spinner__dot-a"></div>
                                <div class="slds-spinner__dot-b"></div>
                                </div>
                            </div>
                        </div>
                        <div class="slds-m-top_medium new-subscriber-form">
                            <lightning-record-edit-form object-api-name="Contact" record-id={selectedSubscriber.Id} class=""
                                onsuccess={handleSuccess} onsubmit={handleSubmit} onerror={handleError} onload={handleLoad}>
                                
                                <lightning-messages></lightning-messages>
                                
                                <div class="slds-grid">
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="FirstName" variant="label-stacked"
                                            class="slds-form-element_1-col" required="true" onchange={clearErrorMessage}
                                            disabled={isWorking}> </lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="LastName" variant="label-stacked"
                                            class="slds-form-element_1-col" required="true" onchange={clearErrorMessage}
                                            disabled={isWorking}> </lightning-input-field>
                                    </div>
                                </div>
                                <div class="slds-grid">
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="Email" variant="label-stacked"
                                            class="slds-form-element_1-col" required="true" onchange={clearErrorMessage}
                                            disabled={isWorking}> </lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="Title" variant="label-stacked"
                                            class="slds-form-element_1-col" onchange={clearErrorMessage}
                                            disabled={isWorking}> </lightning-input-field>
                                    </div>
                                </div>
                                <div class="slds-grid">
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="MailingCity" variant="label-stacked"
                                            class="slds-form-element_1-col" required="true" onchange={clearErrorMessage}
                                            disabled={isWorking}> </lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="MailingState" variant="label-stacked"
                                            class="slds-form-element_1-col" onchange={clearErrorMessage}
                                            disabled={isWorking}> </lightning-input-field>
                                    </div>
                                </div>
                                <div class="slds-grid">
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="MailingCountry" variant="label-stacked"
                                            class="slds-form-element_1-col" required="true" onchange={clearErrorMessage}
                                            disabled={isWorking}> </lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input-field field-name="Phone" variant="label-stacked"
                                            class="slds-form-element_1-col" onchange={clearErrorMessage}
                                            disabled={isWorking}> </lightning-input-field>
                                    </div>
                                </div>
                                <lightning-button type="submit" label="Submit" class="hidden-in-form"
                                    onchange={clearErrorMessage} disabled={isWorking}></lightning-button>
                            </lightning-record-edit-form>
                        </div>
                    </div>
                    <div class="slds-modal__footer">
                        <span class="slds-m-right_medium error">
                            {errorMessage}
                        </span>
                        <lightning-button label="Cancel" title="" onclick={cancel} class="slds-m-left_x-small"
                            disabled={isWorking}>
                        </lightning-button>
                        <lightning-button label="Save" variant="brand" title="" onclick={save} class="slds-m-left_x-small"
                            disabled={isWorking}>
                        </lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <template if:true={showContactPreferencesModalFor}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small"
                aria-labelledby="modal-heading-01" aria-modal="true">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <h1 id="modal-heading-02" class="slds-modal__title slds-hyphenate">Subscription Preferences for
                            {showContactPreferencesModalFor.Name}</h1>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium preferences-modal_min-height" id="modal-content-id-2">
                        <div if:true={isWorking}>
                            <div class="slds-spinner_container slds-is-fixed">
                                <div role="status" class="slds-spinner slds-spinner_medium">
                                <span class="slds-assistive-text">Loading</span>
                                <div class="slds-spinner__dot-a"></div>
                                <div class="slds-spinner__dot-b"></div>
                                </div>
                            </div>
                        </div>

                        <template if:true={masterPreferences}>
                            <lightning-accordion allow-multiple-sections-open>
                                <template for:each={masterPreferences} for:item="masterPreference" for:index="i">
                                    <template if:false={masterPreference.disabled}>
                                        <lightning-accordion-section key={masterPreference.root.Name}
                                            name={masterPreference.root.Name} label={masterPreference.root.Name}>
                                            <div slot="actions" class="width-40">
                                                <div class="slds-grid">
                                                    <div class="slds-col slds-text-align_center width-50">
                                                        <template if:true={masterPreference.disabled}>
                                                            <div class="th-title font-size_875">
                                                                Email Alert
                                                            </div>
                                                            <div class="slds-text-color_weak font-size_875">
                                                                N/A
                                                            </div>
                                                        </template>
                                                        <template if:false={masterPreference.disabled}>
                                                            <div class="th-title font-size_875">
                                                                Email Alert
                                                            </div>
                                                            <div class="">
                                                                <div if:true={masterPreference.isIndividualStateAll}
                                                                    class="section-all">
                                                                    <a onclick={toggleCategory} data-i={i} data-category="ind"><i class="fal fa-check-square"></i></a>
                                                                </div>
                                                                <div if:true={masterPreference.isIndividualStateSome}
                                                                    class="section-some">
                                                                    <a onclick={toggleCategory} data-i={i} data-category="ind"><i class="fal fa-minus-square"></i></a>
                                                                </div>
                                                                <div if:true={masterPreference.isIndividualStateNone}
                                                                    class="section-none">
                                                                    <a onclick={toggleCategory} data-i={i} data-category="ind"><i class="fal fa-square"></i></a>                                                                
                                                                </div>
                                                                <div class="pref-state">{masterPreference.indState}</div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                    <div class="slds-col slds-text-align_center width-50">
                                                        <template if:true={masterPreference.disabled}>
                                                            <div class="th-title font-size_875 padding-right_extra">
                                                                Daily Summary
                                                            </div>
                                                            <div
                                                                class="slds-text-color_weak font-size_875 padding-right_extra">
                                                                N/A
                                                            </div>
                                                        </template>
                                                        <template if:false={masterPreference.disabled}>
                                                            <div class="th-title font-size_875 padding-right_extra">
                                                                Daily Summary
                                                            </div>
                                                            <div class="padding-right_extra">
                                                                <div if:true={masterPreference.isDailyStateAll}
                                                                    class="section-all">
                                                                    <a onclick={toggleCategory} data-i={i} data-category="daily"><i class="fal fa-check-square"></i></a>
                                                                </div>
                                                                <div if:true={masterPreference.isDailyStateSome}
                                                                    class="section-some">
                                                                    <a onclick={toggleCategory} data-i={i} data-category="daily"><i class="fal fa-minus-square"></i></a>
                                                                </div>
                                                                <div if:true={masterPreference.isDailyStateNone}
                                                                    class="section-none">
                                                                    <a onclick={toggleCategory} data-i={i} data-category="daily"><i class="fal fa-square"></i></a>
                                                                </div>                                                                                                                     
                                                                <div class="pref-state">{masterPreference.dailyState}</div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                            <template if:true={masterPreference.libs}>
                                                <table
                                                    class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout"
                                                    aria-label="Example default base table of Opportunities">
                                                    <thead>
                                                        <tr class="slds-line-height_reset">
                                                            <th class="width-60" scope="col">
                                                                <div class="slds-truncate" title=""></div>
                                                            </th>
                                                            <th class="width-20" scope="col">
                                                                <!--                                                      
                                                            <div if:false={masterPreference.disabled} class="slds-text-align_center slds-text-body_x-small" title="">
                                                                <a onclick={selectAll}>All</a>&nbsp;|&nbsp;<a onclick={selectNone}>None</a>
                                                            </div>
                                                            -->
                                                            </th>
                                                            <th class="width-20" scope="col">
                                                                <!--
                                                            <div if:false={masterPreference.disabled} class="slds-text-align_center slds-text-body_x-small" title="">
                                                                <a onclick={selectAll}>All</a>&nbsp;|&nbsp;<a onclick={selectNone}>None</a>
                                                            </div>
                                                            -->
                                                            </th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template for:each={masterPreference.libs} for:item="lib"
                                                            for:index="j">
                                                            <template if:true={lib.showRow}>
                                                                <tr key={lib.lib.Name} class="slds-hint-parent">
                                                                    <th data-label="" scope="row">
                                                                        <div class="slds-truncate" title="Cloudhub">
                                                                            {lib.lib.Name}</div>
                                                                    </th>
                                                                    <td data-label="">
                                                                        <div class="slds-text-align_center" title="">
                                                                            <template if:true={lib.isNa}>
                                                                                <div class="slds-text-color_weak">
                                                                                    N/A
                                                                                </div>
                                                                            </template>
                                                                            <template if:false={lib.isNa}>
                                                                                <div class="negative-margins">
                                                                                    <lightning-input type="checkbox"
                                                                                        label="hidden"
                                                                                        variant="label-hidden"
                                                                                        checked={lib.ind}
                                                                                        disabled={lib.No_Summary_Emails_Option__c}
                                                                                        onchange={bind} name="ind"
                                                                                        data-i={i} data-j={j}>
                                                                                    </lightning-input>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </td>
                                                                    <td data-label="">
                                                                        <div class="slds-text-align_center" title="">
                                                                            <template if:true={lib.isNa}>
                                                                                <div class="slds-text-color_weak">
                                                                                    N/A
                                                                                </div>
                                                                            </template>
                                                                            <template if:false={lib.isNa}>
                                                                                <div class="negative-margins">
                                                                                    <lightning-input type="checkbox"
                                                                                        label="hidden"
                                                                                        variant="label-hidden"
                                                                                        checked={lib.daily}
                                                                                        disabled={lib.No_Summary_Emails_Option__c}
                                                                                        onchange={bind} name="daily"
                                                                                        data-i={i} data-j={j}>
                                                                                    </lightning-input>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </template>
                                        </lightning-accordion-section>
                                    </template>
                                </template>
                            </lightning-accordion>
                        </template>
                        <!-- <iframe src={masterPreferencesSrc} frameborder="0" height="100%" width="100%"></iframe> -->
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label="Cancel" title="" onclick={cancelContactPreferences}
                            class="slds-m-left_x-small" disabled={isWorking}>
                        </lightning-button>
                        <lightning-button label="Save" variant="brand" title="" onclick={saveContactPreferences}
                            class="slds-m-left_x-small" disabled={isWorking}>
                        </lightning-button>

                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        
        <template if:true={showToggleStatusConfirmFor}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small"
                aria-labelledby="modal-heading-03" aria-modal="true">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <h1 id="modal-heading-03" class="slds-modal__title slds-hyphenate">Confirm Status Update</h1>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium"
                        id="modal-content-id-3">
                        <div if:true={isWorking}>
                            <div class="slds-spinner_container slds-is-fixed">
                                <div role="status" class="slds-spinner slds-spinner_medium">
                                <span class="slds-assistive-text">Loading</span>
                                <div class="slds-spinner__dot-a"></div>
                                <div class="slds-spinner__dot-b"></div>
                                </div>
                            </div>
                        </div>
                        <div class="slds-p-around_medium slds-text-align_center">
                        Update the Status for <b>{showToggleStatusConfirmFor.Name}</b> to <b>{showToggleStatusConfirmFor.Status__c}</b>?
                        </div>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label="No" title="" onclick={cancelToggleStatus} class="slds-m-left_x-small"
                            disabled={isWorking}>
                        </lightning-button>
                        <lightning-button label="Yes" variant="brand" title="" onclick={confirmToggleStatus} class="slds-m-left_x-small"
                            disabled={isWorking}>
                        </lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>    
    </template>
    <template if:true={isSelfServiceAdministrator}>
        <div class="slds-m-around_x-large slds-text-align_center">
            You have not been assigned permissions for Client Portal Self-Service Administration.
        </div>
    </template>
</template>
