<!--
  @description       : Log a call, Creates Event and Event relation records
  @last modified on  : 05-31-2023
-->
<template>
	<template if:true={showSpinner}>
		<lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
	</template>
	<lightning-card title="Log a Call">
        <div class="slds-card__footer card-header">
			<lightning-button class="slds-p-left_x-small slds-p-right_x-small" variant="brand"
				icon-name="utility:save" label="Save" onclick={handleSave}>
			</lightning-button>
			<lightning-button class="slds-p-right_x-small" icon-name="utility:close" label="Cancel"
				onclick={handleCancel}></lightning-button>
		</div>
		<div style="margin:20px">
		
            <lightning-layout multiple-rows="true" pull-to-boundary="medium">
                <lightning-layout-item padding="horizontal-small" size="12" small-device-size="4">
                    <lightning-input type="text" label="Subject" required data-type="event" data-name="subject"></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item padding="horizontal-small" size="12" small-device-size="2">
                    <lightning-combobox
                        label="Type"
                        options={eventTypeOption} value={eventType} required data-type="event" data-name="type"></lightning-combobox>
                </lightning-layout-item>
                
                <lightning-layout-item padding="horizontal-small" size="7" small-device-size="2">
                    <label class="slds-form-element__label">
                        <abbr class="slds-required" title="required">*</abbr>Start Date
                    </label>
                    <lightning-input type="date" value={defaultToday} label="Start" required data-type="event" data-name="start" variant="label-hidden"></lightning-input>
                </lightning-layout-item>
                
                <lightning-layout-item padding="horizontal-small" size="5" small-device-size="2">
                    <lightning-combobox
                        name="end"
                        label="Duration"
                        value={durationInMinutes}
                        required data-type="event" data-name="end"
                        placeholder="Duration (In minutes)"
                        options={durationOptions} >
                    </lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item padding="horizontal-small" size="12"  small-device-size="2">
                    <label class="slds-form-element__label">
                        Assigned To
                    </label>
                    <c-eg-custom-lookup type="User" value={ownerId}
                        selection={ownerName} additional-style="max-width: 400px;"
                        disabled={hasExistingEvent}
                        icon-name="standard:user" placeholder="Select Event Owner"
                        onselect={handleLookupSelection}>
                    </c-eg-custom-lookup>
                </lightning-layout-item>
                <lightning-layout-item padding="horizontal-small" size="12" small-device-size="2">
                    <label class="slds-form-element__label">
                        Opportunity
                    </label>
                    <c-eg-custom-lookup type="Opportunity" value={oppId}
                        selection={oppName} additional-style="max-width: 400px;"
                        icon-name="standard:opportunity" placeholder="Select Opportunity"
                        filter-field="AccountId" filter-value={originatingAccountId}
                        onselect={handleLookupSelection}>
                    </c-eg-custom-lookup>
                </lightning-layout-item>
                <lightning-layout-item padding="horizontal-small" size="12" small-device-size="2">
                    <label class="slds-form-element__label">
                        Opportunity Product
                    </label>
                    <c-eg-custom-lookup type="OpportunityLineItem" value={oppLineItemId}
                        selection={oppLineItemName} additional-style="max-width: 400px;"
                        icon-name="standard:product_item" placeholder="Select Opportunity Product"
                        disabled={noProject} filter-value={oppId}
                        filter-field="opportunityId" onselect={handleLookupSelection}>
                    </c-eg-custom-lookup>
                </lightning-layout-item>
                
                
                <lightning-layout-item padding="horizontal-small" size="12" small-device-size="8">
                    <lightning-textarea name="background" label="Background Notes" required data-type="event" data-name="background"></lightning-textarea>
                </lightning-layout-item>
            </lightning-layout>

                    onsectiontoggle={handleSectionToggle}
                    active-section-name={activeSections}-->

                                    onretrieve={selectItemEventHandler}

                                </c-multi-select-lookup>
                            </lightning-card>
